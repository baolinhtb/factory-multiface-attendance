<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFactory AI - Monitoring System</title>

    <!-- React & ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX/TSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #root {
            width: 100%;
            height: 100vh;
        }

        /* Utility Classes */
        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-2 {
            gap: 8px;
        }

        .gap-3 {
            gap: 12px;
        }

        .gap-4 {
            gap: 16px;
        }

        .p-4 {
            padding: 16px;
        }

        .p-6 {
            padding: 24px;
        }

        .w-full {
            width: 100%;
        }

        .h-full {
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* Form Elements */
        input,
        select,
        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 14px;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            padding: 12px 20px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        /* Layout */
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-card {
            width: 400px;
            max-width: 90%;
        }

        .main-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            font-size: 1.25rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: white;
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            font-weight: 600;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 64px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
        }

        .video-container {
            aspect-ratio: 640/480;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border);
            position: relative;
        }

        .video-container.alerting {
            border-color: var(--error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .log-container {
            max-height: 250px;
            overflow-y: auto;
        }

        .log-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .stat-item {
            background: var(--bg-dark);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 10px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 600;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid var(--border);
        }

        /* Toggle Switch */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #475569;
            border-radius: 24px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-switch.on {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }

        .toggle-switch.on::after {
            transform: translateX(20px);
        }

        /* Animations */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-error {
            background: var(--error);
            color: white;
        }

        .badge-admin {
            background: var(--primary);
            color: white;
        }

        .badge-user {
            background: #475569;
            color: white;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Error Text */
        .error-text {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
        }

        /* Success Text */
        .success-text {
            color: var(--success);
            font-size: 0.875rem;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = 'http://127.0.0.1:8000';

        // API Service
        const api = axios.create({
            baseURL: API_URL,
        });

        api.interceptors.request.use((config) => {
            const token = localStorage.getItem('token');
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
        });

        api.interceptors.response.use(
            (response) => response,
            (error) => {
                if (error.response?.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.reload();
                }
                return Promise.reject(error);
            }
        );

        // Login Component
        function Login({ onLoginSuccess }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                try {
                    const response = await api.post('/login', formData);
                    localStorage.setItem('token', response.data.access_token);
                    localStorage.setItem('user', JSON.stringify({
                        username: username,
                        role: response.data.role
                    }));
                    onLoginSuccess();
                } catch (err) {
                    setError(err.response?.data?.detail || 'Lỗi đăng nhập');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="login-container">
                    <div className="card login-card">
                        <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                            <div style={{
                                background: 'rgba(59, 130, 246, 0.1)',
                                width: '60px',
                                height: '60px',
                                borderRadius: '50%',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                margin: '0 auto 15px'
                            }}>
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth="2">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                </svg>
                            </div>
                            <h2 style={{ fontSize: '1.5rem', fontWeight: 600 }}>SmartCore System</h2>
                            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '5px' }}>
                                Hệ thống giám sát nhà máy AI
                            </p>
                        </div>

                        <form onSubmit={handleSubmit}>
                            <div className="input-group">
                                <label>Tên đăng nhập</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    placeholder="admin"
                                    required
                                />
                            </div>

                            <div className="input-group">
                                <label>Mật khẩu</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="••••••••"
                                    required
                                />
                            </div>

                            {error && <div className="error-text" style={{ marginBottom: '15px', textAlign: 'center' }}>{error}</div>}

                            <button type="submit" className="btn-primary w-full" disabled={loading}>
                                {loading ? 'Đang xác thực...' : 'Đăng Nhập'}
                            </button>
                        </form>

                        <p style={{ textAlign: 'center', fontSize: '0.75rem', color: '#475569', marginTop: '20px' }}>
                            Tài khoản mặc định: admin / admin123
                        </p>
                    </div>
                </div>
            );
        }

        // Dashboard Component
        function Dashboard() {
            const [stats, setStats] = useState([]);
            const [logs, setLogs] = useState([]);
            const [isAlerting, setIsAlerting] = useState(false);
            const videoRef = useRef(null);
            const wsRef = useRef(null);
            const audioCtxRef = useRef(null);
            const lastSoundTimeRef = useRef(0);
            const [alarmEnabled, setAlarmEnabled] = useState(true);

            const addLog = (msg, type) => {
                const time = new Date().toLocaleTimeString();
                setLogs(prev => [{ msg, type, time }, ...prev].slice(0, 50));
            };

            const playSound = () => {
                if (!alarmEnabled) return;
                if (Date.now() - lastSoundTimeRef.current < 1500) return;
                lastSoundTimeRef.current = Date.now();

                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = audioCtxRef.current;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            };

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const res = await api.get('/stats');
                        setStats(res.data);
                    } catch (e) {
                        console.error('Error fetching stats:', e);
                    }
                };

                fetchStats();
                const interval = setInterval(fetchStats, 5000);

                const ws = new WebSocket(`ws://127.0.0.1:8000/ws/video`);
                wsRef.current = ws;

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (videoRef.current) {
                        videoRef.current.src = `data:image/jpeg;base64,${data.image}`;
                    }

                    setAlarmEnabled(data.enable_alarm);

                    let alerting = false;
                    if (data.has_unknown) {
                        alerting = true;
                        addLog("Phát hiện người lạ!", "error");
                        playSound();
                    }
                    if (data.has_phone) {
                        alerting = true;
                        addLog("Phát hiện sử dụng điện thoại!", "error");
                        playSound();
                    }
                    setIsAlerting(alerting);
                };

                return () => {
                    ws.close();
                    clearInterval(interval);
                };
            }, []);

            const formatTime = (s) => {
                if (s < 60) return Math.round(s) + 's';
                return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
            };

            return (
                <div className="dashboard-grid">
                    <div className="flex flex-col gap-4">
                        <div className="card">
                            <div className="flex items-center justify-between" style={{ marginBottom: '15px' }}>
                                <div className="flex items-center gap-2">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth="2">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                    <h3 style={{ fontWeight: 600 }}>Giám sát trực tiếp</h3>
                                </div>
                                {isAlerting && (
                                    <span className="badge badge-error pulse">CẢNH BÁO</span>
                                )}
                            </div>
                            <div className={`video-container ${isAlerting ? 'alerting' : ''}`}>
                                <img ref={videoRef} className="video-stream" alt="Live Stream" />
                            </div>
                        </div>

                        <div className="card" style={{ height: '250px', display: 'flex', flexDirection: 'column' }}>
                            <h3 style={{ marginBottom: '15px', fontSize: '1rem', fontWeight: 600 }}>Lịch sử cảnh báo</h3>
                            <div className="log-container">
                                {logs.map((log, idx) => (
                                    <div key={idx} className="log-item">
                                        <span style={{ color: log.type === 'error' ? 'var(--error)' : 'var(--success)' }}>
                                            {log.msg}
                                        </span>
                                        <span style={{ color: 'var(--text-muted)', fontSize: '0.75rem' }}>
                                            {log.time}
                                        </span>
                                    </div>
                                ))}
                                {logs.length === 0 && (
                                    <p style={{ textAlign: 'center', color: 'var(--text-muted)', marginTop: '20px' }}>
                                        Chưa có cảnh báo nào
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="flex items-center gap-2" style={{ marginBottom: '20px' }}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            <h3 style={{ fontWeight: 600 }}>Top Vi Phạm ĐT</h3>
                        </div>
                        <div>
                            {stats.map((s, idx) => (
                                <div key={idx} className="stat-item">
                                    <div>
                                        <strong style={{ marginRight: '10px' }}>{idx + 1}</strong>
                                        {s.name}
                                    </div>
                                    <div style={{ color: 'var(--warning)', fontWeight: 600 }}>
                                        {formatTime(s.seconds)}
                                    </div>
                                </div>
                            ))}
                            {stats.length === 0 && (
                                <p style={{ textAlign: 'center', color: 'var(--text-muted)', marginTop: '40px' }}>
                                    Chưa có dữ liệu thống kê
                                </p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // UserManagement Component
        function UserManagement() {
            const [users, setUsers] = useState([]);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [role, setRole] = useState('user');
            const [loading, setLoading] = useState(false);

            const fetchUsers = async () => {
                try {
                    const res = await api.get('/users');
                    setUsers(res.data);
                } catch (e) {
                    console.error('Error fetching users:', e);
                }
            };

            useEffect(() => {
                fetchUsers();
            }, []);

            const handleAddUser = async (e) => {
                e.preventDefault();
                setLoading(true);

                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('role', role);

                try {
                    await api.post('/users', formData);
                    setUsername('');
                    setPassword('');
                    setRole('user');
                    fetchUsers();
                    alert('Tạo người dùng thành công!');
                } catch (err) {
                    alert(err.response?.data?.detail || 'Lỗi khi thêm người dùng');
                } finally {
                    setLoading(false);
                }
            };

            const deleteUser = async (id) => {
                if (!confirm('Bạn có chắc muốn xóa tài khoản này?')) return;
                try {
                    await api.delete(`/users/${id}`);
                    fetchUsers();
                } catch (e) {
                    console.error('Error deleting user:', e);
                }
            };

            return (
                <div className="dashboard-grid">
                    <div className="card">
                        <h3 style={{ marginBottom: '20px', fontSize: '1.25rem', fontWeight: 600 }}>
                            Nhân viên hệ thống
                        </h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Tên tài khoản</th>
                                    <th>Quyền hạn</th>
                                    <th style={{ textAlign: 'right' }}>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                {users.map(u => (
                                    <tr key={u.id}>
                                        <td>{u.username}</td>
                                        <td>
                                            <span className={`badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}`}>
                                                {u.role === 'admin' ? 'Quản trị' : 'Thường'}
                                            </span>
                                        </td>
                                        <td style={{ textAlign: 'right' }}>
                                            {u.username !== 'admin' && (
                                                <button
                                                    onClick={() => deleteUser(u.id)}
                                                    style={{ padding: '6px 12px', color: 'var(--error)', background: 'transparent' }}
                                                >
                                                    Xóa
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="card" style={{ height: 'fit-content' }}>
                        <h3 style={{ marginBottom: '20px', fontSize: '1.25rem', fontWeight: 600 }}>
                            Thêm tài khoản mới
                        </h3>
                        <form onSubmit={handleAddUser}>
                            <div className="input-group">
                                <label>Tên đăng nhập</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    required
                                />
                            </div>
                            <div className="input-group">
                                <label>Mật khẩu</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                />
                            </div>
                            <div className="input-group">
                                <label>Quyền hạn</label>
                                <select value={role} onChange={(e) => setRole(e.target.value)}>
                                    <option value="user">Người dùng thông thường</option>
                                    <option value="admin">Quản trị viên</option>
                                </select>
                            </div>
                            <button type="submit" className="btn-primary w-full" disabled={loading}>
                                {loading ? 'Đang tạo...' : 'Tạo Tài Khoản'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Settings Component
        function Settings() {
            const [settings, setSettings] = useState({
                camera_src: '0',
                show_age_gender: 'true',
                enable_alarm: 'true',
                enable_phone_det: 'true'
            });
            const [loading, setLoading] = useState(false);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [regName, setRegName] = useState('');
            const [regFile, setRegFile] = useState(null);
            const [regLoading, setRegLoading] = useState(false);

            useEffect(() => {
                const fetchSettings = async () => {
                    try {
                        const res = await api.get('/settings');
                        setSettings(res.data);
                    } catch (e) {
                        console.error('Error fetching settings:', e);
                    }
                };
                fetchSettings();
            }, []);

            const handleSaveSettings = async () => {
                setLoading(true);
                try {
                    await api.put('/settings', settings);
                    setSaveSuccess(true);
                    setTimeout(() => setSaveSuccess(false), 3000);
                } catch (e) {
                    alert('Lỗi khi lưu cài đặt');
                } finally {
                    setLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!regFile || !regName) return;
                setRegLoading(true);

                const formData = new FormData();
                formData.append('name', regName);
                formData.append('file', regFile);

                try {
                    await api.post('/register', formData);
                    alert('Đăng ký nhận diện thành công!');
                    setRegName('');
                    setRegFile(null);
                    e.target.reset();
                } catch (err) {
                    alert(err.response?.data?.detail || 'Lỗi đăng ký');
                } finally {
                    setRegLoading(false);
                }
            };

            const toggleSetting = (key) => {
                setSettings(prev => ({
                    ...prev,
                    [key]: prev[key] === 'true' ? 'false' : 'true'
                }));
            };

            return (
                <div className="dashboard-grid">
                    <div className="card">
                        <h3 style={{ marginBottom: '20px', fontSize: '1.25rem', fontWeight: 600 }}>
                            Cấu hình AI & Hệ thống
                        </h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                            <div>
                                <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '5px' }}>
                                    Nguồn Video (ID hoặc RTSP)
                                </label>
                                <input
                                    type="text"
                                    value={settings.camera_src}
                                    onChange={(e) => setSettings({ ...settings, camera_src: e.target.value })}
                                    placeholder="0 hoặc link RTSP"
                                />
                            </div>

                            <div className="flex items-center justify-between">
                                <span>Hiển thị tuổi & giới tính</span>
                                <div
                                    className={`toggle-switch ${settings.show_age_gender === 'true' ? 'on' : ''}`}
                                    onClick={() => toggleSetting('show_age_gender')}
                                />
                            </div>

                            <div className="flex items-center justify-between">
                                <span>Kích hoạt phát hiện điện thoại</span>
                                <div
                                    className={`toggle-switch ${settings.enable_phone_det === 'true' ? 'on' : ''}`}
                                    onClick={() => toggleSetting('enable_phone_det')}
                                />
                            </div>

                            <div className="flex items-center justify-between">
                                <span>Chuông báo khi có vi phạm</span>
                                <div
                                    className={`toggle-switch ${settings.enable_alarm === 'true' ? 'on' : ''}`}
                                    onClick={() => toggleSetting('enable_alarm')}
                                />
                            </div>

                            <button
                                onClick={handleSaveSettings}
                                className={`w-full ${saveSuccess ? 'btn-success' : 'btn-primary'}`}
                                disabled={loading}
                                style={{ marginTop: '10px' }}
                            >
                                {loading ? 'Đang lưu...' : saveSuccess ? 'Đã Lưu Thành Công' : 'Lưu Cấu Hình'}
                            </button>
                        </div>
                    </div>

                    <div className="card">
                        <h3 style={{ marginBottom: '20px', fontSize: '1.25rem', fontWeight: 600 }}>
                            Đăng ký khuôn mặt mới
                        </h3>
                        <form onSubmit={handleRegister}>
                            <div className="input-group">
                                <label>Họ và tên nhân viên</label>
                                <input
                                    type="text"
                                    value={regName}
                                    onChange={(e) => setRegName(e.target.value)}
                                    placeholder="Nguyễn Văn A"
                                    required
                                />
                            </div>
                            <div className="input-group">
                                <label>Ảnh chân dung (file)</label>
                                <input
                                    type="file"
                                    onChange={(e) => setRegFile(e.target.files[0])}
                                    accept="image/*"
                                    required
                                />
                            </div>
                            <button type="submit" className="btn-primary w-full" disabled={regLoading}>
                                {regLoading ? 'Đang xử lý AI...' : 'Đăng Ký Nhận Diện'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const checkAuth = async () => {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        setLoading(false);
                        return;
                    }

                    try {
                        const res = await api.get('/me');
                        setCurrentUser(res.data);
                        setIsAuthenticated(true);
                    } catch (e) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    } finally {
                        setLoading(false);
                    }
                };

                checkAuth();
            }, []);

            const handleLoginSuccess = () => {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    setCurrentUser(JSON.parse(userStr));
                    setIsAuthenticated(true);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setIsAuthenticated(false);
                setCurrentUser(null);
            };

            if (loading) {
                return (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh' }}>
                        <p>Đang tải...</p>
                    </div>
                );
            }

            if (!isAuthenticated) {
                return <Login onLoginSuccess={handleLoginSuccess} />;
            }

            const navItems = [
                { id: 'dashboard', label: 'Tổng quan', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z' },
                ...(currentUser?.role === 'admin' ? [
                    { id: 'users', label: 'Quản lý tài khoản', icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75' },
                    { id: 'settings', label: 'Cài đặt hệ thống', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z' }
                ] : [])
            ];

            const pageTitle = {
                dashboard: 'Bảng điều khiển',
                users: 'Quản lý tài khoản',
                settings: 'Cài đặt hệ thống'
            };

            return (
                <div className="main-layout">
                    <aside className="sidebar">
                        <div className="sidebar-header flex items-center gap-3">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            SmartCore
                        </div>

                        <nav style={{ flex: 1, padding: '10px' }}>
                            {navItems.map(item => (
                                <div
                                    key={item.id}
                                    className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                                    onClick={() => setCurrentPage(item.id)}
                                >
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d={item.icon}></path>
                                    </svg>
                                    {item.label}
                                </div>
                            ))}
                        </nav>

                        <div style={{ padding: '20px', borderTop: '1px solid var(--border)' }}>
                            <div className="flex items-center gap-3" style={{ marginBottom: '15px' }}>
                                <div style={{
                                    width: '36px',
                                    height: '36px',
                                    background: 'var(--primary)',
                                    borderRadius: '50%',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    fontWeight: 'bold',
                                    fontSize: '0.8rem'
                                }}>
                                    {currentUser?.username?.substring(0, 2).toUpperCase()}
                                </div>
                                <div>
                                    <div style={{ fontSize: '0.9rem', fontWeight: 600 }}>{currentUser?.username}</div>
                                    <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>
                                        {currentUser?.role === 'admin' ? 'Quản trị viên' : 'Nhân viên'}
                                    </div>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="btn-danger w-full" style={{ fontSize: '0.85rem' }}>
                                Đăng xuất
                            </button>
                        </div>
                    </aside>

                    <div className="content-area">
                        <div className="header">
                            <h2 style={{ fontSize: '1.1rem', fontWeight: 500 }}>
                                {pageTitle[currentPage]}
                            </h2>
                        </div>
                        <div className="content-scroll">
                            {currentPage === 'dashboard' && <Dashboard />}
                            {currentPage === 'users' && <UserManagement />}
                            {currentPage === 'settings' && <Settings />}
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
