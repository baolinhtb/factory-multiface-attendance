<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh - Factory Attendance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 1300px;
        }

        .video-container {
            position: relative;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            width: 640px;
            height: 480px;
            background: #000;
        }

        #videoStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .log-container {
            width: 320px;
            background: #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 480px;
            /* Match video height */
            box-sizing: border-box;
        }

        .log-header {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #555;
            padding-bottom: 8px;
            color: #00d2ff;
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            font-size: 0.85rem;
            padding-right: 5px;
        }

        /* Custom scrollbar */
        .log-list::-webkit-scrollbar {
            width: 6px;
        }

        .log-list::-webkit-scrollbar-track {
            background: #222;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .log-list::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .log-item {
            padding: 10px 0;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #28a745;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <h1 style="margin-bottom: 20px; font-weight: 300;">Hệ Thống Điểm Danh Khuôn Mặt</h1>
    <div class="container">
        <div class="video-container">
            <img id="videoStream" src="" alt="Live Stream" />
        </div>
        <div class="log-container">
            <div class="log-header">Lịch Sử Nhận Diện</div>
            <div class="log-list" id="logList">
                <div class="log-item">
                    <span>Hệ thống sẵn sàng</span>
                    <span class="status-badge">OK</span>
                </div>
            </div>

            <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
                <div class="log-header"
                    style="margin-bottom: 10px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center;">
                    <span>Đăng Ký & Cài Đặt</span>
                    <button id="toggleSound" onclick="toggleSound()"
                        style="font-size: 0.7rem; padding: 2px 8px; cursor: pointer; background: #444; color: white; border: 1px solid #666; border-radius: 4px;">Máy
                        báo: BẬT</button>
                </div>
                <input type="text" id="regName" placeholder="Nhập họ tên..."
                    style="width: 100%; padding: 6px; margin-bottom: 6px; border: 1px solid #555; background: #222; color: white; border-radius: 4px; box-sizing: border-box;">
                <input type="file" id="regFile" accept="image/*"
                    style="width: 100%; margin-bottom: 8px; font-size: 0.75rem;">
                <button onclick="registerUser()"
                    style="width: 100%; padding: 8px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;">ĐĂNG
                    KÝ</button>
            </div>
        </div>

        <div class="log-container" style="width: 250px;">
            <div class="log-header" style="color: #ff9800;">Top Vi Phạm ĐT</div>
            <div class="log-list" id="statsList">
                <div style="text-align: center; color: #888; margin-top: 20px;">Đang tải dữ liệu...</div>
            </div>
            <div
                style="margin-top: auto; font-size: 0.7rem; color: #888; text-align: center; border-top: 1px solid #444; padding-top: 5px;">
                Tự động cập nhật sau 5s
            </div>
        </div>
    </div>

    <script>
        const videoImg = document.getElementById('videoStream');
        const logList = document.getElementById('logList');
        let ws;
        let alarmEnabled = true;

        // Initialize Audio Context for Warning Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastSoundTime = 0;

        function playWarningSound() {
            if (!alarmEnabled) return;
            // Throttle sound to once every 1.5 seconds to avoid noise
            if (Date.now() - lastSoundTime < 1500) return;
            lastSoundTime = Date.now();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleSound() {
            alarmEnabled = !alarmEnabled;
            const btn = document.getElementById('toggleSound');
            btn.innerText = alarmEnabled ? "Máy báo: BẬT" : "Máy báo: TẮT";
            btn.style.background = alarmEnabled ? "#444" : "#880000";

            // Resume context on user click
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function registerUser() {
            const name = document.getElementById('regName').value;
            const fileInput = document.getElementById('regFile');

            if (!name || fileInput.files.length === 0) {
                alert("Vui lòng nhập tên và chọn ảnh chân dung.");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("file", fileInput.files[0]);

            try {
                addLog(`Đang xử lý: ${name}`, 'WARN');
                const response = await fetch('http://127.0.0.1:8000/register', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    addLog(`Đã đăng ký: ${name}`, 'SUCCESS');
                    alert("Đăng ký thành công!");
                    document.getElementById('regName').value = '';
                    fileInput.value = '';
                } else {
                    addLog(`Lỗi: ${result.detail}`, 'ERROR');
                    alert("Lỗi: " + result.detail);
                }
            } catch (err) {
                console.error(err);
                addLog("Lỗi kết nối máy chủ", 'ERROR');
            }
        }

        function connect() {
            ws = new WebSocket('ws://127.0.0.1:8000/ws/video');

            ws.onopen = () => {
                console.log('Đã kết nối WebSocket');
                addLog('Máy chủ đã kết nối', 'INFO');
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Display frame
                    videoImg.src = `data:image/jpeg;base64,${data.image}`;

                    // Handle Alerts
                    let isAlerting = false;
                    if (data.has_unknown) {
                        playWarningSound();
                        isAlerting = true;
                        addLog("CẢNH BÁO: Phát hiện người lạ!", "ERROR");
                    }

                    if (data.has_phone) {
                        playWarningSound();
                        isAlerting = true;
                        addLog("CẢNH BÁO: Phát hiện sử dụng ĐIỆN THOẠI!", "ERROR");
                    }

                    if (isAlerting) {
                        videoImg.style.borderColor = "#ff0000";
                        videoImg.style.boxShadow = "0 0 25px rgba(255, 0, 0, 0.7)";
                    } else {
                        videoImg.style.borderColor = "#444";
                        videoImg.style.boxShadow = "none";
                    }
                } catch (e) {
                    console.error("Lỗi xử lý dữ liệu:", e);
                }
            };

            ws.onclose = () => {
                addLog('Máy chủ mất kết nối. Đang thử lại...', 'WARN');
                setTimeout(connect, 3000);
            };

            ws.onerror = (err) => {
                ws.close();
            };
        }

        function addLog(message, type) {
            const time = new Date().toLocaleTimeString();
            let color = '#28a745';
            if (type === 'WARN') color = '#ffc107; color:black';
            if (type === 'ERROR') color = '#dc3545';
            if (type === 'INFO') color = '#17a2b8';

            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <span>${message}</span>
                <span class="status-badge" style="background: ${color}">${time}</span>
            `;
            logList.prepend(div);
            // Limit log items
            if (logList.children.length > 20) {
                logList.lastChild.remove();
            }
        }

        async function updateStats() {
            try {
                const response = await fetch('http://127.0.0.1:8000/stats');
                const data = await response.json();
                const statsList = document.getElementById('statsList');
                statsList.innerHTML = '';

                if (data.length === 0) {
                    statsList.innerHTML = '<div style="text-align: center; color: #888; margin-top: 20px;">Chưa có dữ liệu</div>';
                    return;
                }

                data.forEach(stat => {
                    const div = document.createElement('div');
                    div.className = 'log-item';
                    const timeStr = stat.seconds < 60 ?
                        `${Math.round(stat.seconds)}s` :
                        `${Math.floor(stat.seconds / 60)}m ${Math.round(stat.seconds % 60)}s`;

                    div.innerHTML = `
                        <span style="font-weight:bold">${stat.name}</span>
                        <span style="color: #ff5252">${timeStr}</span>
                    `;
                    statsList.appendChild(div);
                });
            } catch (e) {
                console.error("Lỗi cập nhật thống kê:", e);
            }
        }

        setInterval(updateStats, 5000);
        updateStats();
        connect();
    </script>
</body>

</html>
